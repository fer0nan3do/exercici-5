name: compile-test
on: [push]
jobs:
  job1:
    name: compile-test-linux
    check-bats-version:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - run: make
        - run: ./conversor c2f 100
  job2:
    name: compile-test-mac
    check-bats-version:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v6
        - run: make
        - run: ./conversor c2f 100
