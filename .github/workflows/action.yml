name: compile-test
on: [push]
jobs:
  check-bats-version:
     name: compile-test-linux
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v6
       - run: make
       - run: ./conversor c2f 100
     name: compile-test-mac
     runs-on: macos-latest
     steps:
       - uses: actions/checkout@v6
       - run: make
       - run: ./conversor c2f 100
